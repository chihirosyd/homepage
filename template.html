<!--
  页面模板源文件 template.html
  数据占位符（__DATA__/__TITLE__/__DESC__/__IMAGE__/__FAVICON__）由 build.mjs 构建时替换。
  构建产物 index.html（不入库）已替换占位符，可双击直接打开。
  修改内容：数据在 links.personal.yml / links.example.yml，样式在本文件。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="__FAVICON__">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESC__">
<meta property="og:type" content="website">
<meta property="og:image" content="__IMAGE__">
<style>
:root{
  --bg:#f4f6fb;--text:#1f2430;--muted:#6b7280;--card:rgba(255,255,255,.72);
  --border:rgba(15,23,42,.08);--blob1:#b9d2ff;--blob2:#f3c8ff;--accent:#4f6ef7;
}
html[data-theme=dark]{
  --bg:#0d1017;--text:#e8ecf3;--muted:#98a2b3;--card:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.09);--blob1:#23408b;--blob2:#5b2a76;--accent:#7d9bff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s;
}
.blob{position:fixed;border-radius:50%;filter:blur(100px);opacity:.5;pointer-events:none}
.b1{width:460px;height:460px;background:var(--blob1);top:-140px;left:-120px}
.b2{width:400px;height:400px;background:var(--blob2);bottom:-140px;right:-100px}
.container{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 20px}
.theme-btn{
  position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:12px;
  border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:17px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s;
}
.theme-btn:hover{transform:scale(1.08)}
.hero{position:relative;text-align:center;padding:84px 0 0}
.avatar{
  width:96px;height:96px;margin:0 auto 20px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;
  background:linear-gradient(135deg,var(--accent),#9b5cf6);
  box-shadow:0 14px 36px rgba(79,110,247,.35);
}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:30px;font-weight:800;letter-spacing:.5px}
.subtitle{margin-top:10px;font-size:14.5px;color:var(--muted)}
.status{
  display:none;margin:16px auto 0;width:max-content;max-width:100%;padding:6px 16px;border-radius:999px;
  font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .25s;
}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}
.social{
  position:relative;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--border);font-size:21px;text-decoration:none;color:var(--text);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.social:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 20px rgba(30,60,160,.15)}
.social img{width:23px;height:23px;object-fit:contain;display:none}
.greeting{margin-top:20px;font-size:13px;color:var(--muted)}
.searchbar{
  display:flex;align-items:center;gap:8px;margin:40px 0 0;padding:9px;
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 26px rgba(30,60,160,.08);
}
.searchbar select{
  border:0;outline:0;background:transparent;color:var(--text);font-size:14px;
  padding:8px 10px;border-radius:10px;cursor:pointer;
}
.searchbar select:hover{background:var(--border)}
.searchbar select option{color:#1f2430;background:#fff}
.searchbar input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);
  font-size:15px;padding:9px 8px;
}
.searchbar input::placeholder{color:var(--muted)}
.searchbar button{
  border:0;border-radius:12px;padding:11px 24px;font-size:14px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#9b5cf6);
  box-shadow:0 6px 16px rgba(79,110,247,.3);transition:filter .15s;
}
.searchbar button:hover{filter:brightness(1.1)}
.about{
  display:none;max-width:640px;margin:44px auto 0;text-align:center;
  font-size:14px;line-height:1.9;color:var(--muted);white-space:pre-line;
}
.section{margin-top:52px}
.section-title{
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:2px;
  color:var(--accent);margin-bottom:16px;
}
.section-title::before{content:"";width:16px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),#9b5cf6)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.project{
  display:block;padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--border);
  text-decoration:none;color:var(--text);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.project:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(30,60,160,.14);border-color:var(--accent)}
.project h3{display:flex;align-items:center;gap:10px;font-size:16px}
.project p{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--border);color:var(--muted)}
.icon{
  position:relative;flex:none;border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--accent),#9b5cf6);
}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;display:none}
.icon .letter,.social .letter{line-height:1}
.icon.sm{width:34px;height:34px;border-radius:10px;font-size:16px}
.icon.xs{width:26px;height:26px;border-radius:8px;font-size:13px}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pill{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:13px;
  background:var(--card);border:1px solid var(--border);text-decoration:none;color:var(--text);
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.pill:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 18px rgba(30,60,160,.12)}
.meta{min-width:0}
.meta b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{
  position:relative;z-index:1;text-align:center;padding:20px 0 34px;margin-top:56px;
  font-size:13px;color:var(--muted);border-top:1px solid var(--border);
}
footer a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--border);transition:color .15s,border-color .15s}
footer a:hover{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:640px){
  .hero{padding-top:64px}
  .projects{grid-template-columns:1fr}
  .nav-grid{grid-template-columns:repeat(2,1fr)}
  .searchbar{flex-wrap:wrap}
  .searchbar input{flex:1 1 100%;order:1}
  .searchbar button{flex:1;order:2}
}
</style>
</head>
<body>
<span class="blob b1"></span><span class="blob b2"></span>
<header class="container hero">
  <button class="theme-btn" id="theme-btn" title="切换主题" aria-label="切换主题">🌙</button>
  <div class="avatar" id="avatar"></div>
  <h1 id="site-title"></h1>
  <p class="subtitle" id="site-subtitle"></p>
  <p class="status" id="status"></p>
  <div class="socials" id="socials"></div>
  <p class="greeting" id="greeting"></p>
</header>
<div class="container">
  <div class="searchbar" id="searchbar">
    <select id="engine" aria-label="搜索引擎"></select>
    <input id="query" type="text" autocomplete="off" spellcheck="false">
    <button id="go" type="button">搜索</button>
  </div>
  <p class="about" id="about"></p>
  <main id="sections"></main>
</div>
<footer id="footer"></footer>
<script type="application/json" id="site-data">__DATA__</script>
<script>
(function(){
"use strict";
var data=JSON.parse(document.getElementById("site-data").textContent);
var site=data.site||{};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function hostOf(u){try{return new URL(u).hostname}catch(e){return ""}}
function iconHtml(l){
  var icon=l.icon||"";
  if(/^https?:\/\//.test(icon)){return '<img src="'+esc(icon)+'" alt="">'}
  if(icon){return '<span class="letter">'+esc(icon)+'</span>'}
  return '<span class="letter">'+esc(Array.from(l.name||"?")[0].toUpperCase())+'</span><img class="auto" alt="" data-domain="'+esc(hostOf(l.url))+'">'
}
// ---- 基本信息 ----
document.title=site.title||"个人引导页";
$("site-title").textContent=site.title||"";
$("site-subtitle").textContent=site.subtitle||"";
var avatar=$("avatar");
if(site.avatar){
  if(/^https?:\/\//.test(site.avatar)){avatar.innerHTML='<img src="'+esc(site.avatar)+'" alt="">'}
  else{avatar.textContent=site.avatar}
}else{avatar.textContent=Array.from(site.title||"?")[0]}
// ---- 状态徽章（支持数组轮播）----
var statusList=site.status?(Object.prototype.toString.call(site.status)==="[object Array]"?site.status:[site.status]):null;
if(statusList){
  var statusEl=$("status");
  statusEl.style.display="inline-block";
  var statusIdx=0;
  var setStatus=function(){statusEl.textContent=statusList[statusIdx]};
  setStatus();
  if(statusList.length>1){
    setInterval(function(){
      statusEl.style.opacity="0";
      setTimeout(function(){statusIdx=(statusIdx+1)%statusList.length;setStatus();statusEl.style.opacity="1"},260)
    },3000)
  }
}
// ---- 问候 ----
var h=new Date().getHours();
var hello=h<5?"夜深了":h<9?"早上好":h<12?"上午好":h<14?"中午好":h<18?"下午好":"晚上好";
$("greeting").textContent=site.greeting||(hello+"，欢迎回来");
// ---- 社交链接 ----
var socials=data.socials||[];
if(socials.length){
  $("socials").innerHTML=socials.map(function(s){
    return '<a class="social" href="'+esc(s.url||"#")+'" title="'+esc(s.name||"")+'" aria-label="'+esc(s.name||"")+'" target="_blank" rel="noopener noreferrer">'+iconHtml(s)+'</a>'
  }).join("")
}else{$("socials").style.display="none"}
// ---- 关于我 ----
if(site.about){$("about").textContent=site.about;$("about").style.display="block"}
// ---- 搜索栏（无配置自动隐藏）----
var search=data.search||{};
var engines=(search.engines&&search.engines.length)?search.engines:null;
if(engines){
  var sel=$("engine");
  sel.innerHTML=engines.map(function(e){return '<option value="'+esc(e.url||"")+'">'+esc(e.name||"")+'</option>'}).join("");
  $("query").placeholder=search.placeholder||"搜索点什么…";
  var go=function(){var q=$("query").value.trim();if(!q){$("query").focus();return}location.href=sel.value.replace("{q}",encodeURIComponent(q))};
  $("go").addEventListener("click",go);
  $("query").addEventListener("keydown",function(e){if(e.key==="Enter")go()})
}else{$("searchbar").style.display="none"}
// ---- 区块：项目 + 导航收藏 ----
var parts=[];
var projects=data.projects||[];
if(projects.length){
  var cards=projects.map(function(p){
    var tags=(p.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("");
    return '<a class="project" href="'+esc(p.url||"#")+'" target="_blank" rel="noopener noreferrer">'+
      '<h3><span class="icon sm">'+iconHtml(p)+'</span>'+esc(p.name||"")+'</h3>'+
      (p.desc?'<p>'+esc(p.desc)+'</p>':"")+
      (tags?'<div class="tags">'+tags+'</div>':"")+
    '</a>'
  }).join("");
  parts.push('<section class="section"><h2 class="section-title">项目</h2><div class="projects">'+cards+'</div></section>')
}
var nav=data.nav&&data.nav.groups||[];
if(nav.length){
  var groups=nav.map(function(g){
    var items=(g.links||[]).map(function(l){
      var desc=l.desc?'<i>'+esc(l.desc)+'</i>':"";
      return '<a class="pill" href="'+esc(l.url||"#")+'" target="_blank" rel="noopener noreferrer"><span class="icon xs">'+iconHtml(l)+'</span><span class="meta"><b>'+esc(l.name||"")+'</b>'+desc+'</span></a>'
    }).join("");
    return '<section class="section"><h2 class="section-title">'+esc(g.name||"")+'</h2><div class="nav-grid">'+items+'</div></section>'
  }).join("");
  parts.push(groups)
}
$("sections").innerHTML=parts.join("");
// ---- favicon 多源回退 ----
// 自定义图片图标（非自动抓取）：CSS 默认隐藏，加载成功才显示
Array.prototype.forEach.call(document.querySelectorAll(".social img:not(.auto),.icon img:not(.auto)"),function(img){
  img.addEventListener("load",function(){img.style.display="block"})
});
Array.prototype.forEach.call(document.querySelectorAll("img.auto"),function(img){
  var d=img.getAttribute("data-domain");
  if(!d)return;
  var idx=0,done=false,timer=null;
  var next=function(){
    if(done||idx>=3){return}
    if(timer){clearTimeout(timer)}
    timer=setTimeout(next,3000);
    if(idx===0){img.src="https://"+d+"/favicon.ico"}
    else if(idx===1){img.src="https://icons.duckduckgo.com/ip3/"+d+".ico"}
    else{img.src="https://www.google.com/s2/favicons?domain="+encodeURIComponent(d)+"&sz=64"}
    idx++
  };
  img.addEventListener("load",function(){done=true;if(timer){clearTimeout(timer)}img.style.display="block"});
  img.addEventListener("error",next);
  next()
});
document.addEventListener("error",function(e){
  var t=e.target;
  if(t&&t.tagName==="IMG"&&!t.classList.contains("auto")){t.style.display="none"}
},true);
// ---- 主题 ----
var KEY="nav-theme";
var saved=null;
try{saved=localStorage.getItem(KEY)}catch(e){}
var dark=saved?saved==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
function apply(d){
  document.documentElement.setAttribute("data-theme",d?"dark":"light");
  $("theme-btn").textContent=d?"☀️":"🌙";
}
apply(dark);
$("theme-btn").addEventListener("click",function(){
  dark=!dark;apply(dark);
  try{localStorage.setItem(KEY,dark?"dark":"light")}catch(e){}
});
// ---- 快捷键 ----
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&engines){
    e.preventDefault();$("query").focus()
  }
});
var footerCredit='© '+new Date().getFullYear()+' · 由 <a href="https://github.com/chihirosyd/homepage" target="_blank" rel="noopener noreferrer">homepage</a> 模板驱动';
var footerHtml=(site.footer?site.footer+' · ':'')+footerCredit;
if(site.analytics){
  footerHtml+=' <span id="busuanzi_container_site_pv" style="display:none"> · 访问 <span id="busuanzi_value_site_pv"></span> 次</span>'
            +' <span id="busuanzi_container_site_uv" style="display:none"> · <span id="busuanzi_value_site_uv"></span> 位访客</span>';
  var bs=document.createElement("script");
  bs.src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
  bs.async=true;
  document.body.appendChild(bs)
}
$("footer").innerHTML=footerHtml;
})();
</script>
</body>
</html>
